[package]
name = "trapdoor-engine"
description = "Playout engine for TRAPDOOR: show model, cue state machine, remote control, media analysis, libmpv decks"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
parking_lot = "0.13"
libloading = "0.9"
rosc = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "time", "io-util"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_LibraryLoader",
] }

[dev-dependencies]
tempfile = "3"
